<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Skill Effects</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hp"><div id="hpFill"></div><span id="hpText"></span></div>
    <div class="stats">
      <span>Kills <b id="score">0</b></span>
      <span>Time <b id="time">0</b>s</span>
      <span>Zombies <b id="zcount">0</b></span>
    </div>
  </div>

  <div id="controls">
    <button id="btnAuto">Auto-cast: OFF (T)</button>
    <button id="btnGod">God mode: OFF (G)</button>
    <label>Spawn <input type="range" id="spawn" min="0" max="3" step="0.25" value="1"></label>
    <button id="btnPause">Pause (P)</button>
    <a href="index.html">← Home</a>
  </div>

  <div id="help">WASD / ลูกศร = เดิน · ยิงอัตโนมัติ · เมาส์ = เล็งสกิล · 1–6 = ใช้สกิล · คลิกพาสซีฟเพื่อเปิด/ปิด</div>

  <div id="skillbar">
    <div class="group" id="passives"></div>
    <div class="group" id="actives"></div>
  </div>

  <div id="overlay" class="hidden">
    <div class="panel">
      <h1 id="ovTitle">GAME OVER</h1>
      <p id="ovText"></p>
      <button id="btnRestart">เริ่มใหม่ (R)</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
